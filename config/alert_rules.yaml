alerts:
  - name: high_latency_p95
    severity: critical
    condition: "latency_p95 > 3000ms for 5 consecutive minutes"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-sre
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: warning
    condition: "error_rate_pct > 2% for 3 consecutive minutes"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: on-call-sre
    runbook: docs/alerts.md#alert-2
  - name: cost_budget_exceeded
    severity: warning
    condition: "total_cost_usd > 2.5 within rolling 24h window"
    duration: 1h
    type: symptom-based
    channel: slack
    owner: platform-lead
    runbook: docs/alerts.md#alert-3
